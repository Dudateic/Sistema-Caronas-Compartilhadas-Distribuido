x-servidor: &servidor
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: servidor
  restart: unless-stopped
  entrypoint: ""
  networks: [consorcio]

x-passageiro: &passageiro
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: passageiro
  profiles: ["clientes"]
  stdin_open: true
  tty: true
  network_mode: "host"

x-motorista: &motorista
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: motorista
  profiles: ["clientes"]
  stdin_open: true
  tty: true
  network_mode: "host"

services:
  empresa-a:
    <<: *servidor
    container_name: vaijunto-empresa-a
    environment:
      EMPRESA: A
      TCP_ADDR: ":6060"
      HTTP_ADDR: ":9090"
      PARES: "B=http://${IP_B:-empresa-b}:9090,C=http://${IP_C:-empresa-c}:9090"
      DADOS_DIR: "/app/dados"
    ports:
      - "0.0.0.0:6060:6060"
      - "0.0.0.0:9091:9090"
    volumes:
      - ../dados/empresa_A:/app/dados
    command: >
      sh -c "mkdir -p /app/dados &&
             [ ! -f /app/dados/cancelamentos.json ] && echo '[]' > /app/dados/cancelamentos.json;
             [ ! -f /app/dados/dados.json ] && echo '[]' > /app/dados/dados.json;
             [ ! -f /app/dados/usuarios.json ] && echo '{}' > /app/dados/usuarios.json;
             [ ! -f /app/dados/reservas.json ] && echo '{}' > /app/dados/reservas.json;
             chmod -R 777 /app/dados;
             exec /app/servidor"

  empresa-b:
    <<: *servidor
    container_name: vaijunto-empresa-b
    environment:
      EMPRESA: B
      TCP_ADDR: ":7070"
      HTTP_ADDR: ":9090"
      PARES: "A=http://${IP_A:-empresa-a}:9090,C=http://${IP_C:-empresa-c}:9090"
      DADOS_DIR: "/app/dados"
    ports:
      - "0.0.0.0:7070:7070"
      - "0.0.0.0:9092:9090"
    volumes:
      - ../dados/empresa_B:/app/dados
    command: >
      sh -c "mkdir -p /app/dados &&
             [ ! -f /app/dados/cancelamentos.json ] && echo '[]' > /app/dados/cancelamentos.json;
             [ ! -f /app/dados/dados.json ] && echo '[]' > /app/dados/dados.json;
             [ ! -f /app/dados/usuarios.json ] && echo '{}' > /app/dados/usuarios.json;
             [ ! -f /app/dados/reservas.json ] && echo '{}' > /app/dados/reservas.json;
             chmod -R 777 /app/dados;
             exec /app/servidor"

  empresa-c:
    <<: *servidor
    container_name: vaijunto-empresa-c
    environment:
      EMPRESA: C
      TCP_ADDR: ":8080"
      HTTP_ADDR: ":9090"
      PARES: "A=http://${IP_A:-empresa-a}:9090,B=http://${IP_B:-empresa-b}:9090"
      DADOS_DIR: "/app/dados"
    ports:
      - "0.0.0.0:8080:8080"
      - "0.0.0.0:9093:9090"
    volumes:
      - ../dados/empresa_C:/app/dados
    command: >
      sh -c "mkdir -p /app/dados &&
             [ ! -f /app/dados/cancelamentos.json ] && echo '[]' > /app/dados/cancelamentos.json;
             [ ! -f /app/dados/dados.json ] && echo '[]' > /app/dados/dados.json;
             [ ! -f /app/dados/usuarios.json ] && echo '{}' > /app/dados/usuarios.json;
             [ ! -f /app/dados/reservas.json ] && echo '{}' > /app/dados/reservas.json;
             chmod -R 777 /app/dados;
             exec /app/servidor"

  passageiro-a:
    <<: *passageiro
    container_name: vaijunto-passageiro-a
    environment:
      SERVIDOR: "127.0.0.1:6060"

  passageiro-b:
    <<: *passageiro
    container_name: vaijunto-passageiro-b
    environment:
      SERVIDOR: "127.0.0.1:7070"

  passageiro-c:
    <<: *passageiro
    container_name: vaijunto-passageiro-c
    environment:
      SERVIDOR: "127.0.0.1:8080"

  motorista-a:
    <<: *motorista
    container_name: vaijunto-motorista-a
    environment:
      SERVIDOR: "127.0.0.1:6060"

  motorista-b:
    <<: *motorista
    container_name: vaijunto-motorista-b
    environment:
      SERVIDOR: "127.0.0.1:7070"

  motorista-c:
    <<: *motorista
    container_name: vaijunto-motorista-c
    environment:
      SERVIDOR: "127.0.0.1:8080"

  simulador:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: simulador
    profiles: [ "testes" ]
    networks: [ consorcio ]
    command: [ "/app/simulador", "-total=10000", "-concorrencia=100", "-alvos=empresa-a:6060,empresa-b:7070,empresa-c:8080" ]

networks:
  consorcio:
    driver: bridge